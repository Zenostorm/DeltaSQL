{% extends "partials/layout.html" %}

{% block content %}
<h2>Remove Badge</h2>
<hr><br>

<div class="login-box">
    <!-- check for badges -->
    {% if badges %}
        <ul style="list-style:none; padding:0;">
        {% for badge in badges %}
            <div class="row">
                <a href="{{ url_for('add_badge') }}">
                    <img src="/static/images/game/badges/{{badge[2]}}" class="icon">
                </a>
                <div class="admin-delete-row">
                    <h3>{{badge[1]}}</h3>
                    <!-- delete form -->
                    <form method="POST">
                        <input type="hidden" name="badge_id" value="{{ badge[0] }}">
                        <input type="submit" value="Delete" class="remove-submit"
                        onclick="return confirm('Are you sure you want to delete this badge?');">
                    </form>
                </div>
            </div>
            </li>
        {% endfor %}
        </ul>
    {% else %}
        <h2>This list is empty, go add something.</h2>
    {% endif %}
</div>
{% endblock %}
