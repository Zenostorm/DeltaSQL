{% extends "partials/layout.html" %}
{% block content %}
<div class="topic">
    <div>
        <h3>{{item[1]}}</h3>
        <h5>{{item[5]}}</h5>
    </div>


        <div class="topic-box">
            <img src="/static/images/items/junk/{{item[6]}}" class="topic-icon">
            <h6 class="topic-row">Type <br> <span class="lighter">{{item[2]}}</span></h6>
            <h6 class="topic-row">Stack limit <br> <span class="lighter">{{item[4]}}</span></h6>
            <h6 class="topic-row">Value <br> <span class="lighter">{{item[3]}}</span></h6>
            {% if stack_value > 0 %}
            <h6 class="topic-row">Value per stack <br> <span class="lighter">{{stack_value}}</span></h6>
            {% endif %}
        </div>
</div>

{% endblock %}
