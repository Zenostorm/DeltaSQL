{% extends "partials/layout.html" %}
{% block content %}
<div class="topic">
    <div>
        <h3>{{armor[1]}}</h3>
        <h5>{{armor[9]}}</h5>
    </div>

        <div class="topic-box">
            <img src="/static/images/gear/leg armor/{{armor[10]}}" class="topic-icon">
            <h6 class="topic-row">Coverage <br> <span class="lighter">{{armor[8]}}</span></h6>
            <h6 class="topic-row">Durability <br> <span class="lighter">{{armor[2]}}</span></h6>
            <h6 class="topic-row">Melee <br> <span class="lighter">{{armor[3]}}</span></h6>
            <h6 class="topic-row">Ballistic <br> <span class="lighter">{{armor[4]}}</span></h6>
            <h6 class="topic-row">Radiation <br> <span class="lighter">{{armor[5]}}</span></h6>
            <h6 class="topic-row">Explosive <br> <span class="lighter">{{armor[6]}}</span></h6>
            <h6 class="topic-row">Mobility <br> <span class="lighter">{{armor[7]}}</span></h6>
        </div>
</div>

{% include 'partials/armor_chart.html' %}
{% endblock %}
